# Asset provenance registry — canonical asset metadata (rights stay in REUSE.toml).
# Every entry's `license` MUST match the actual REUSE annotation (validated by test).
# `creation` is orthogonal to rights: an AI-generated logo is still LicenseRef.
defaults:
  - path: assets/images/banners/
    creation: ai-generated
  - path: assets/images/icons/
    creation: ai-generated
assets:
  - path: assets/images/dagfinn.webp
    creation: human-created
    license: LicenseRef-NoExcuse-All-Rights-Reserved
    note: "commissioned team portrait per .design/photography-brief.md"
  - path: assets/images/hero-illustration.webp
    creation: ai-generated
    license: CC0-1.0
    note: "prompt-documented .design/graphics.md Style 1"
  - path: assets/images/noexcuse-logo-azure.webp
    creation: human-created
    license: LicenseRef-NoExcuse-All-Rights-Reserved
    note: "brand logo (trademark carve-out in LICENSE)"
  - path: assets/images/noexcuse-logo-horizontal.webp
    creation: human-created
    license: LicenseRef-NoExcuse-All-Rights-Reserved
    note: "brand logo (trademark carve-out in LICENSE)"
  - path: assets/images/og-image.webp
    creation: unresolved
    license: unresolved
    note: "no prompt documentation, no photo evidence — reported unresolved"
  - path: assets/images/ai-icons/eu-ai-basic-black.svg
    creation: third-party
    license: unresolved
    note: "© European Commission, free for Article 50 labeling; no SPDX identifier — reported unresolved"
  - path: assets/images/ai-icons/eu-ai-basic-white.svg
    creation: third-party
    license: unresolved
    note: "© European Commission, free for Article 50 labeling; no SPDX identifier — reported unresolved"
