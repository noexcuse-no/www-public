url: "https://noexcuse.no"
license: "CC0-1.0"
license_url: "https://creativecommons.org/publicdomain/zero/1.0/"

include:
  - _pages
  - .well-known

kramdown:
  footnote_backlink: "↩"

collections:
  tags:
    output: true
    permalink: /emne/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      lang: no
      published: true
  - scope:
      path: ""
      type: tags
    values:
      layout: tag
      lang: no
