url: "https://noexcuse.no"

include:
  - _pages
  - .well-known

kramdown:
  footnote_backlink: "↩"

collections:
  tags:
    output: true
    permalink: /emne/:path/

exclude:
  - .design/
  - .specs/
  - .research/
  - .omo/
  - .github/
  - .git/
  - .vscode/
  - .idea/
  - .jekyll-cache/
  - node_modules/
  - scripts/
  - tests/
  - LICENSES/
  - AGENTS.md
  - BACKLOG.md
  - CHANGELOG.md
  - LICENSE
  - README.md
  - VERSION
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - Gemfile
  - Gemfile.lock
  - stylelint.config.mjs
  - vitest.config.mjs
  - .gitignore
  - .gitattributes
  - .editorconfig
  - .npmrc
  - .nvmrc
  - .ruby-version
  - oh-my-openagent.json
  - opencode.json
  - stylelint.config.mjs
  - vitest.config.mjs
  - assets/*.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: article
      lang: no
      published: true
  - scope:
      path: ""
      type: tags
    values:
      layout: tag
      lang: no

# Multilingual substrate (future-proofing):
# - Per-language dir convention: _pages/no/, _pages/en/ (not implemented yet)
# - Commercial-copy ownership: website owns commercial copy/pricing/VAT/privacy per language
# - Scheduler (Bookings) sits beneath — handles language at form level
# - URL convention: /no/bestill/..., /en/book/... (future, substrate only)
# - hreflang guard in _includes/metadata.html emits link tags ONLY when site.data.languages exists
