url: "https://noexcuse.no"

kramdown:
  footnote_backlink: "↩"

collections:
  pages:
    output: true
    permalink: /:path/
  tags:
    output: true
    permalink: /emne/:path/

exclude:
  - .design/
  - .specs/
  - .research/
  - .omo/
  - .github/
  - .git/
  - .vscode/
  - .idea/
  - .jekyll-cache/
  - node_modules/
  - scripts/
  - tests/
  - LICENSES/
  - AGENTS.md
  - BACKLOG.md
  - CHANGELOG.md
  - LICENSE
  - README.md
  - VERSION
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - Gemfile
  - Gemfile.lock
  - stylelint.config.mjs
  - vitest.config.mjs
  - .gitignore
  - .gitattributes
  - .editorconfig
  - .npmrc
  - .nvmrc
  - .ruby-version
  - oh-my-openagent.json
  - opencode.json
  - stylelint.config.mjs
  - vitest.config.mjs
  - assets/*.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      lang: no
      published: true
  - scope:
      path: ""
      type: tags
    values:
      layout: tag
      lang: no
