<section class="newsletter section container--narrow" aria-labelledby="newsletter-heading">
  <h2 id="newsletter-heading" class="newsletter__heading section__heading">Hold deg oppdatert</h2>
  <p class="newsletter__lead">Få artikler om ledelse, struktur og innflytelse rett i innboksen din. Ingen spam — kun nyttig innhold.</p>

  <form class="newsletter__form" novalidate>
    <div class="newsletter__field-group">
      <label for="newsletter-email" class="newsletter__label">Epostadresse</label>
      <input
        type="email"
        id="newsletter-email"
        name="email"
        class="newsletter__input"
        placeholder="din@epost.no"
        required
        autocomplete="email"
        aria-describedby="newsletter-email-error newsletter-consent"
      >
      <span id="newsletter-email-error" class="newsletter__error" aria-live="polite" hidden></span>
    </div>

    <fieldset class="newsletter__consent-group">
      <legend id="newsletter-consent" class="newsletter__consent-label">Samtykke</legend>
      <div class="newsletter__checkbox-wrapper">
        <input
          type="checkbox"
          id="newsletter-consent-checkbox"
          name="consent"
          class="newsletter__checkbox"
          required
        >
        <label for="newsletter-consent-checkbox" class="newsletter__checkbox-label">
          Jeg samtykker til at No Excuse lagrer min epost for nyhetsbrev.
          <a href="/personvern/" class="newsletter__privacy-link">Les personvernerklæring</a>
        </label>
      </div>
    </fieldset>

    <button type="submit" class="newsletter__submit cta cta--primary" disabled>
      <span class="newsletter__submit-text">Meld meg på</span>
      <span class="newsletter__submit-loading" hidden aria-hidden="true">
        <svg class="newsletter__spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="newsletter__spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </span>
    </button>

    <p class="newsletter__status" aria-live="polite" hidden></p>
  </form>
</section>
