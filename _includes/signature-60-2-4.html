{% comment %}
  60/2/4 signature — branded visual object extending the stat bridge.
  Renders the "60 / 2 / 4" mechanism beneath the hero on the homepage and
  product page. Works in both themes.

  Usage:
    {% include signature-60-2-4.html %}
{% endcomment %}
<div class="signature-60-2-4" role="presentation" aria-label="60 spørsmål, 2 timer, 4 perspektiver">
  <div class="signature-item">
    <span class="signature-number">60</span>
    <span class="signature-label">spørsmål</span>
  </div>
  <span class="signature-slash" aria-hidden="true">/</span>
  <div class="signature-item">
    <span class="signature-number">2</span>
    <span class="signature-label">timer</span>
  </div>
  <span class="signature-slash" aria-hidden="true">/</span>
  <div class="signature-item">
    <span class="signature-number">4</span>
    <span class="signature-label">perspektiver</span>
  </div>
</div>
