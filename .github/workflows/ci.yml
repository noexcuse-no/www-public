name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint

  reuse:
    runs-on: ubuntu-latest
    # Non-blocking while the unresolved set is non-empty (documented
    # expected failures — see .specs/mixed-rights-licensing/README.md).
    # Gating rule: flip continue-on-error off once the unresolved set is
    # empty (BACKLOG CI1 tracks the flip).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m venv /tmp/reuse-venv && /tmp/reuse-venv/bin/pip install 'reuse[charset-normalizer]==6.2.0'
      - run: /tmp/reuse-venv/bin/reuse lint

  rights-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run rights:check
      - run: git diff --exit-code -- _data/rights.json

  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v 3.10.0
      - run: jekyll build -d /tmp/site-out --safe
      - run: jq . /tmp/site-out/.well-known/ai-transparency.json
      - run: test -f /tmp/site-out/rettigheter/index.html && grep -q 'id="proprietary"' /tmp/site-out/rettigheter/index.html
      - run: grep -q 'rel="license"' /tmp/site-out/index.html && grep -q 'href="/rettigheter/"' /tmp/site-out/index.html

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
