version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    groups:
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
      github-actions:
        patterns:
          - "*"
        dependency-type: "production"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"